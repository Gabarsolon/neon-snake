<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04050d">
<title>Snake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2304050d'/%3E%3Cpath d='M14 46h20a8 8 0 0 0 0-16h-6a8 8 0 0 1 0-16h14' fill='none' stroke='%2321e6d2' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='46' r='5' fill='%23ffae35'/%3E%3C/svg%3E">
<style>
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --h1: 176; --h2: 256; --h3: 34;
  --ink: #04050d;
  --font: "Avenir Next", "Futura", "Century Gothic", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body {
  font-family: var(--font); color: #eef1ff;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; }

/* ── ambient light ── */
.aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; will-change: transform; }
.aurora i:nth-child(1) { left: -38vmax; top: -48vmax; background: radial-gradient(closest-side, hsla(var(--h1), 100%, 48%, .34), transparent); animation: drift-a 29s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { right: -40vmax; bottom: -52vmax; background: radial-gradient(closest-side, hsla(var(--h2), 100%, 58%, .34), transparent); animation: drift-b 37s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { left: 50%; top: 50%; width: 70vmax; height: 70vmax; margin: -35vmax; background: radial-gradient(closest-side, hsla(var(--h3), 100%, 55%, .09), transparent); animation: drift-c 43s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(22vmax, 14vmax) scale(1.25); } }
@keyframes drift-b { to { transform: translate(-20vmax, -12vmax) scale(1.18); } }
@keyframes drift-c { from { transform: translate(-18vmax, 8vmax) scale(.9); } to { transform: translate(18vmax, -8vmax) scale(1.2); } }

#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, .6) 100%); }
.grain { position: fixed; inset: 0; pointer-events: none; opacity: .7; }

/* ── hud ── */
.hud { position: fixed; z-index: 8; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 0 6px 15px; pointer-events: none; }
.stat { display: flex; flex-direction: column; gap: 6px; transition: opacity .45s ease; }
.stat small { font-size: 9.5px; font-weight: 700; letter-spacing: .36em; color: rgba(255, 255, 255, .42); }
.stat b { display: block; font-size: clamp(22px, 3.6vw, 30px); font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .02em; transform-origin: 0 60%; text-shadow: 0 0 20px hsla(var(--h1), 100%, 60%, .6); }
.stat.r { align-items: flex-end; margin-right: 8px; }
.stat.r b { transform-origin: 100% 60%; }
.hud .right { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; }
.bump { animation: bump .34s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 35% { transform: scale(1.24); } }

.combo { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .3s ease, transform .35s cubic-bezier(.2, 1.5, .4, 1); }
.combo.on { opacity: 1; transform: none; }
.combo b { display: block; font-size: 21px; font-weight: 800; line-height: .9; letter-spacing: .03em; color: hsl(var(--h3), 100%, 72%); text-shadow: 0 0 18px hsla(var(--h3), 100%, 55%, .9); }
.combo .bar { display: block; width: clamp(64px, 14vw, 112px); height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.combo .bar i { display: block; width: 100%; height: 100%; border-radius: inherit; transform-origin: 0 50%; background: linear-gradient(90deg, hsl(var(--h3), 100%, 60%), #fff); }

.icon { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: rgba(255, 255, 255, .75); transition: transform .2s ease, background .2s ease, color .2s ease, opacity .45s ease; }
.icon:hover { background: rgba(255, 255, 255, .13); color: #fff; transform: scale(1.1); }
.icon:active { transform: scale(.94); }
.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon .off, body.muted #btnSound .on, body[data-mode="paused"] #btnPause .on { display: none; }
body.muted #btnSound .off, body[data-mode="paused"] #btnPause .off { display: inline; }
body[data-mode="menu"] .hud .stat, body[data-mode="over"] .hud .stat,
body[data-mode="menu"] #btnPause, body[data-mode="over"] #btnPause { opacity: 0; pointer-events: none; }

/* ── overlays ── */
.overlay { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px; text-align: center; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .5s ease, visibility 0s linear .5s; }
.overlay::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(4, 5, 13, .3) 0%, rgba(4, 5, 13, .8) 78%); -webkit-backdrop-filter: blur(3px) saturate(1.15); backdrop-filter: blur(3px) saturate(1.15); }
#menu::before { background: radial-gradient(ellipse at 50% 46%, rgba(4, 5, 13, .22) 0%, rgba(4, 5, 13, .66) 80%); -webkit-backdrop-filter: blur(1.5px) saturate(1.15); backdrop-filter: blur(1.5px) saturate(1.15); }
.panel { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateY(18px) scale(.96); transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
body[data-mode="menu"] #menu, body[data-mode="paused"] #pause, body[data-mode="over"] #over { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
body[data-mode="menu"] #menu .panel, body[data-mode="paused"] #pause .panel, body[data-mode="over"] #over .panel { transform: none; }

.logo { display: flex; font-size: clamp(60px, 17vw, 184px); font-weight: 800; line-height: 1; letter-spacing: .07em; padding-left: .07em; filter: drop-shadow(0 0 32px hsla(var(--h1), 100%, 55%, .5)); }
.logo span { --a: hsl(176, 100%, 68%); --b: hsl(226, 100%, 58%); display: inline-block; background: linear-gradient(180deg, #fff 10%, var(--a) 48%, var(--b) 94%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) both; }
.logo span:nth-child(2) { animation-delay: .07s; } .logo span:nth-child(3) { animation-delay: .14s; }
.logo span:nth-child(4) { animation-delay: .21s; } .logo span:nth-child(5) { animation-delay: .28s; }
@keyframes rise { from { opacity: 0; transform: translateY(.3em) scale(.92); } }

.cta { position: relative; margin-top: clamp(26px, 6vh, 54px); padding: 17px 50px 17px 58px; border: 2px solid transparent; border-radius: 999px; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: .44em; color: #fff;
  background: linear-gradient(#090b1a, #0c0f24) padding-box, conic-gradient(from var(--ang), hsl(var(--h1), 100%, 60%), hsl(var(--h2), 100%, 68%), hsl(var(--h3), 100%, 60%), hsl(var(--h1), 100%, 60%)) border-box;
  box-shadow: 0 0 34px hsla(var(--h1), 100%, 55%, .38), inset 0 0 20px hsla(var(--h2), 100%, 62%, .16);
  animation: spin 5s linear infinite; transition: transform .25s cubic-bezier(.2, 1.5, .4, 1), box-shadow .25s ease; }
.cta:hover { transform: scale(1.06); box-shadow: 0 0 52px hsla(var(--h1), 100%, 55%, .6), inset 0 0 26px hsla(var(--h2), 100%, 62%, .28); }
.cta:active { transform: scale(.97); }
@keyframes spin { to { --ang: 360deg; } }

.keys { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 24px; font-size: 10.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: rgba(255, 255, 255, .46); }
.keys span { display: inline-flex; align-items: center; }
kbd { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; margin-right: 4px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .06); box-shadow: 0 2px 0 rgba(255, 255, 255, .07); font: 600 11px/1 var(--font); letter-spacing: .06em; color: rgba(255, 255, 255, .86); }
kbd:last-of-type { margin-right: 10px; }
.keys.touch, .mob { display: none; }
body.coarse .keys { display: none; } body.coarse .keys.touch { display: flex; }
body.coarse .desk { display: none; } body.coarse .mob { display: inline; }
.record { margin-top: 22px; min-height: 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .36em; color: hsl(var(--h3), 100%, 72%); text-shadow: 0 0 16px hsla(var(--h3), 100%, 55%, .7); }

.paused { font-size: clamp(32px, 8vw, 76px); font-weight: 300; letter-spacing: .5em; padding-left: .5em; text-shadow: 0 0 30px hsla(var(--h1), 100%, 60%, .75); }
.sub { margin-top: 20px; font-size: 10.5px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: rgba(255, 255, 255, .5); }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .62em; padding-left: .62em; color: hsl(348, 100%, 72%); text-shadow: 0 0 18px hsla(348, 100%, 60%, .85); }
.final { margin-top: 10px; font-size: clamp(72px, 17vw, 168px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .01em; background: linear-gradient(180deg, #fff 12%, hsl(var(--h1), 100%, 66%) 52%, hsl(var(--h2), 100%, 60%) 96%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; filter: drop-shadow(0 0 30px hsla(var(--h1), 100%, 55%, .5)); }
.newbest { margin-top: 6px; padding: 7px 14px 7px 18px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .36em; color: #1d1300; background: linear-gradient(90deg, #ffe08a, #ff9f43); box-shadow: 0 0 28px rgba(255, 190, 80, .65); transform: scale(0); max-height: 0; padding-block: 0; transition: transform .5s cubic-bezier(.2, 1.6, .4, 1) .55s; }
.newbest.on { transform: scale(1); max-height: 40px; padding-block: 7px; }
.stats { display: flex; gap: clamp(24px, 6vw, 58px); margin-top: 28px; }
.stats div { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.stats b { font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stats small { font-size: 9px; font-weight: 700; letter-spacing: .34em; padding-left: .34em; color: rgba(255, 255, 255, .42); }

@media (max-width: 540px) { .hud .stat.r { display: none; } .keys { gap: 10px 16px; } }
@media (prefers-reduced-motion: reduce) { .aurora i, .cta, .logo span { animation: none; } }
</style>
</head>
<body data-mode="menu">

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="c"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>

<header class="hud" id="hud">
  <div class="stat"><small>SCORE</small><b id="score">0</b></div>
  <div class="combo" id="combo"><b id="comboX">×1</b><span class="bar"><i id="comboBar"></i></span></div>
  <div class="right">
    <div class="stat r"><small>BEST</small><b id="best">0</b></div>
    <button class="icon" id="btnSound" tabindex="-1" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><g class="on"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="off"><path d="m16 9 5 6m0-6-5 6"/></g></svg>
    </button>
    <button class="icon" id="btnPause" tabindex="-1" aria-label="Pause">
      <svg viewBox="0 0 24 24"><g class="on"><path d="M8 5v14M16 5v14"/></g><g class="off"><path d="M8 5l11 7-11 7z"/></g></svg>
    </button>
  </div>
</header>

<section class="overlay" id="menu">
  <div class="panel">
    <h1 class="logo" aria-label="Snake"><span>S</span><span>N</span><span>A</span><span>K</span><span>E</span></h1>
    <button class="cta" id="btnPlay" tabindex="-1">PLAY</button>
    <div class="keys">
      <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>steer</span>
      <span><kbd>space</kbd>play · pause</span>
      <span><kbd>M</kbd>sound</span>
    </div>
    <div class="keys touch"><span>swipe to steer · tap to play</span></div>
    <p class="record" id="menuBest"></p>
  </div>
</section>

<section class="overlay" id="pause">
  <div class="panel">
    <p class="paused">PAUSED</p>
    <p class="sub"><span class="desk">press space to resume</span><span class="mob">tap to resume</span></p>
  </div>
</section>

<section class="overlay" id="over">
  <div class="panel">
    <p class="eyebrow" id="overTitle">GAME OVER</p>
    <div class="final" id="final">0</div>
    <div class="newbest" id="newBest">NEW BEST</div>
    <div class="stats">
      <div><b id="stLen">0</b><small>LENGTH</small></div>
      <div><b id="stCombo">×1</b><small>MAX COMBO</small></div>
      <div><b id="stBest">0</b><small>BEST</small></div>
    </div>
    <button class="cta" id="btnAgain" tabindex="-1">PLAY AGAIN</button>
  </div>
</section>

<script>
(() => {
'use strict';

// ── helpers ─────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const { min, max, abs, sin, cos, exp, sqrt, floor, round, ceil, atan2, hypot, PI } = Math;
const TAU = PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => floor(rnd(a, b + 1));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const outCubic = (t) => 1 - (1 - t) ** 3;
const outBack = (t) => 1 + 2.9 * (t - 1) ** 3 + 1.9 * (t - 1) ** 2;
const wrap360 = (h) => ((h % 360) + 360) % 360;
const hsla = (h, s, l, a = 1) => `hsla(${wrap360(h).toFixed(1)},${s}%,${l.toFixed(1)}%,${a.toFixed(3)})`;
// move a toward b by t along the shortest way around a circle of size `full`
const turnTo = (a, b, t, full) => a + ((((b - a) % full) + full * 1.5) % full - full / 2) * t;

const store = {
  get(k, d) { try { const v = localStorage.getItem('neon-snake.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('neon-snake.' + k, String(v)); } catch (e) {} },
};

const coarse = matchMedia('(pointer: coarse)').matches;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Avenir Next","Futura","Century Gothic","Segoe UI",system-ui,sans-serif';
const HUE0 = 176;        // head hue at the start of a run
const SPREAD = 112;      // hue travelled along the body
const FOOD_SHIFT = 218;  // food hue relative to the head
const PAD = 0.16;        // board padding around the grid, in cells
const BLOOM = 1.5;       // halo laid under the scene
const HEAT = 0.1;        // bloom added back on top

// ── audio: synthesised music + sfx, no assets ───────────────────────────
const audio = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const BPM = 104, STEP = 60 / BPM / 4, BEAT = STEP * 4;
  // [bass, ...arp notes] as midi — Am9, Fmaj9, Cmaj7, G6/9
  const CHORDS = [[45, 57, 60, 64, 67, 71], [41, 53, 57, 60, 64, 67], [48, 55, 60, 64, 67, 71], [43, 55, 59, 62, 67, 69]];
  const ARP = [[0, 1, 2, 3, 4, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1], [0, 2, 1, 3, 2, 4, 3, 2, 0, 2, 1, 3, 4, 3, 2, 1]];
  const SCALE = [69, 72, 74, 76, 79, 81, 84, 86, 88];
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  let ac = null, master, sfx, mus, lp, send, noise;
  let muted = store.get('muted', '0') === '1', scene = 'menu', heat = 0, stepI = 0, nextT = 0, beatAt = 0;

  function init() {
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.18;
    master.connect(comp); comp.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6; lp.frequency.value = 1000; lp.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.5; mus.connect(lp);
    send = ac.createGain(); send.gain.value = 0.45;
    const dl = ac.createDelay(1), fb = ac.createGain(), tone = ac.createBiquadFilter();
    dl.delayTime.value = STEP * 3; fb.gain.value = 0.4; tone.type = 'lowpass'; tone.frequency.value = 2600;
    send.connect(dl); dl.connect(tone); tone.connect(fb); fb.connect(dl); tone.connect(lp);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ac.currentTime + 0.08;
    setInterval(schedule, 28);
    applyScene();
  }

  function voice(type, f, at, dur, vol, dest, o = {}) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, at);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, at + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + (o.attack || 0.005));
    if (o.hold) g.gain.setValueAtTime(vol, at + dur - o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    if (o.cut) {
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || 1;
      fl.frequency.setValueAtTime(o.cut, at);
      if (o.cutTo) fl.frequency.exponentialRampToValueAtTime(o.cutTo, at + dur);
      osc.connect(fl); fl.connect(g);
    } else osc.connect(g);
    g.connect(dest); if (o.echo) g.connect(send);
    osc.start(at); osc.stop(at + dur + 0.05);
  }

  function hiss(at, dur, vol, type, f, dest, fTo, q) {
    const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise; src.loop = true;
    fl.type = type; fl.Q.value = q || 0.7; fl.frequency.setValueAtTime(f, at);
    if (fTo) fl.frequency.exponentialRampToValueAtTime(fTo, at + dur);
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(fl); fl.connect(g); g.connect(dest);
    src.start(at, Math.random() * 0.8); src.stop(at + dur + 0.05);
  }

  // one sixteenth note of the backing track; layers come in with the action
  function playStep(i, at) {
    const s = i % 16, ch = CHORDS[(i >> 4) % 4], pat = ARP[(i >> 6) & 1];
    if (s % 4 === 0) beatAt = at;
    const lvl = scene !== 'playing' ? 0 : heat >= 4 ? 3 : heat >= 2 ? 2 : 1;
    if (s === 0) for (let k = 1; k <= 3; k++) voice('sawtooth', hz(ch[k]), at, STEP * 17, 0.024, mus, { attack: 0.45, hold: 0.7, cut: 850, detune: (k - 2) * 7 });
    if (lvl > 0 || s % 2 === 0) {
      const n = ch[1 + pat[s]] + (lvl >= 3 && s % 4 === 2 ? 12 : 0);
      voice('sawtooth', hz(n), at, 0.28, lvl ? 0.07 : 0.05, mus, { cut: lvl ? 2400 + heat * 250 : 1400, cutTo: 360, q: 5, echo: 1 });
    }
    if (lvl >= 1) {
      if (s % 2 === 0) voice('sawtooth', hz(ch[0] + (s === 14 ? 12 : 0)), at, 0.22, s % 4 === 0 ? 0.1 : 0.17, mus, { cut: 560, cutTo: 130, q: 2 });
      if (s % 4 === 0) voice('sine', 150, at, 0.26, 0.5, mus, { to: 40, glide: 0.11, attack: 0.002 });
    }
    if (lvl >= 2) {
      if (s % 4 === 2) hiss(at, 0.045, 0.05, 'highpass', 7500, mus);
      if (s === 4 || s === 12) hiss(at, 0.13, 0.085, 'bandpass', 1700, mus, 0, 1.1);
    }
    if (lvl >= 3 && s % 2 === 1) hiss(at, 0.025, 0.022, 'highpass', 9000, mus);
  }

  function schedule() {
    if (!ac || ac.state !== 'running') return;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.12) { playStep(stepI++, nextT); nextT += STEP; }
  }

  function applyScene() {
    if (!ac) return;
    const t = ac.currentTime;
    const cut = scene === 'playing' ? min(12000, 2200 + heat * 1500) : scene === 'dying' ? 240 : scene === 'paused' ? 450 : 1050;

let boardW = 0, boardH = 0, boardOff = 0;
let glow = [], ghostR = null, ghostB = null;          // bloom mip chain, rgb-split buffers

const cellX = (x) => bx + (x + 0.5) * cell;

function mkCanvas(w, h) {

// ── layout ──────────────────────────────────────────────────────────────
function metrics() {
  W = max(200, innerWidth); H = max(200, innerHeight);
  const small = min(W, H) < 560;
  hudH = small ? 60 : 74; margin = small ? 12 : 26;
}

// grid dimensions that suit the current viewport; fixed for the length of a run
function gridFor() {
  const aw = W - margin * 2, ah = H - hudH - margin * 2;
  const cs = clamp(min(aw, ah) / 13, 26, 44);
  let cols = floor(aw / cs + 0.05), rows = floor(ah / cs + 0.05);
  cols = min(cols, round(rows * 1.9)); rows = min(rows, round(cols * 1.9));
  if (cols * rows > 600) { const k = sqrt(600 / (cols * rows)); cols = floor(cols * k); rows = floor(rows * k); }
  return [clamp(cols, 8, 36), clamp(rows, 8, 36)];
}

function layout() {
  metrics();
  dpr = min(window.devicePixelRatio || 1, 2, sqrt(6.5e6 / (W * H))) * quality;
  canvas.width = max(1, round(W * dpr)); canvas.height = max(1, round(H * dpr));
  glow = [];
  for (let i = 0, gw = ceil(W / 2), gh = ceil(H / 2); i < 6 && gw >= 4 && gh >= 4; i++, gw = ceil(gw / 2), gh = ceil(gh / 2)) glow.push(mkCanvas(gw, gh));
  ghostR = ghostB = null;
  fitBoard();
}

function fitBoard() {
  const g = G, aw = W - margin * 2, ah = H - hudH - margin * 2;
  cell = clamp(floor(min(aw / g.cols, ah / g.rows)), 6, 54);
  bw = g.cols * cell; bh = g.rows * cell;
  bx = round((W - bw) / 2); by = round(hudH + margin + (ah - bh) / 2);
  hud.style.left = bx + 'px'; hud.style.width = bw + 'px'; hud.style.top = (by - hudH) + 'px'; hud.style.height = hudH + 'px';
  // the static part of the board is drawn once: glass panel + resting grid dots
  const p = cell * PAD, m = 2, w = bw + (p + m) * 2, h = bh + (p + m) * 2, c = boardCx;
  boardCv.width = max(1, ceil(w * dpr)); boardCv.height = max(1, ceil(h * dpr));
  boardW = w; boardH = h; boardOff = p + m;
  c.setTransform(dpr, 0, 0, dpr, boardOff * dpr, boardOff * dpr);
  rr(c, -p, -p, bw + p * 2, bh + p * 2, cell * 0.5);
  const fill = c.createLinearGradient(0, -p, 0, bh + p);
  fill.addColorStop(0, 'rgba(17,20,46,0.80)'); fill.addColorStop(1, 'rgba(6,7,18,0.88)');
  c.fillStyle = fill; c.fill();
  c.fillStyle = 'rgba(255,255,255,0.013)'; c.beginPath();
  for (let j = 0; j < g.rows; j++) for (let i = (j & 1); i < g.cols; i += 2) c.rect(i * cell, j * cell, cell, cell);
  c.fill();
  c.fillStyle = 'rgba(255,255,255,0.15)'; c.beginPath();
  const r = max(0.8, cell * 0.034);
  for (let j = 0; j < g.rows; j++) for (let i = 0; i < g.cols; i++) { const x = (i + 0.5) * cell, y = (j + 0.5) * cell; c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
  c.fill();
}

function rr(c, x, y, w, h, r) {
  r = min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);

// ── effects ─────────────────────────────────────────────────────────────
const parts = [], rings = [], ripples = [], popups = [], dust = [];
for (let i = 0; i < 46; i++) dust.push({ x: Math.random(), y: Math.random(), z: rnd(0.3, 1), p: rnd(0, TAU) });

function spark(x, y, vx, vy, life, size, h, l) {
  if (parts.length < 900) parts.push({ x, y, vx, vy, life, ttl: life, size, h, l });
}
function burst(x, y, h, n, power, l) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = cell * rnd(1.5, 9) * power;
    spark(x, y, cos(a) * v, sin(a) * v, rnd(0.35, 0.85), rnd(1.2, 3.2) * cell / 36, h + rnd(-16, 16), l);
  }
}
function ring(x, y, h, r1, life, w) { rings.push({ x, y, h, r1, life, ttl: life, w }); }
function ripple(x, y, a, speed, life) { ripples.push({ x, y, a0: a, a, r: 0, speed: speed * cell, w: cell * 0.85, life, ttl: life }); }
function popup(x, y, text, h, size) { popups.push({ x, y, text, h, size, life: 1.05, ttl: 1.05 }); }

function updateFx(dt) {
  const drag = exp(-dt * 3.2);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vx *= drag; p.vy *= drag; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) if ((rings[i].life -= dt) <= 0) rings.splice(i, 1);
  for (let i = popups.length - 1; i >= 0; i--) if ((popups[i].life -= dt) <= 0) popups.splice(i, 1);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.life -= dt;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    r.r += r.speed * dt; r.a = r.a0 * (r.life / r.ttl);
  }
}

// ── game ────────────────────────────────────────────────────────────────
function newGame(demo) {
  const [cols, rows] = gridFor();
  const g = {
    demo, cols, rows,
    snake: [], dir: { x: 1, y: 0 }, queue: [], grow: 0, prevTail: null, pending: null,
    acc: 0, delay: demo ? 0.15 : 0.5, speed: 8, stepTime: 0.125,
    food: null, bonus: null, bonusIn: irnd(4, 6),
    eaten: 0, score: 0, combo: 1, comboT: 0, comboWin: 4, comboMax: 1,
    alive: true, perfect: false, done: false, dieT: 0, dieDur: 0, dieEnd: Infinity, dissolve: 0,
    bulges: [], time: 0, hunger: 0, angle: 0, blink: rnd(1.5, 4), tongue: rnd(1, 3), ember: 0,
    hue0: demo && demoCount++ ? rnd(0, 360) : HUE0,
  };
  const y = rows >> 1, x0 = max(4, floor(cols * 0.3));
  for (let i = 0; i < 4; i++) g.snake.push({ x: x0 - i, y });
  g.prevTail = { x: x0 - 4, y };   // so the first frame is already mid-slide
  tune(g); g.food = spawn(g);
  return g;
}

function tune(g) {
  const base = g.demo ? 9.5 : coarse ? 6.4 : 7.6, cap = g.demo ? 13 : coarse ? 11 : 14.5;
  g.speed = min(cap, base + g.eaten * 0.11); g.stepTime = 1 / g.speed;
}

// seconds a clean run from the head to `it` takes, padded by `slack`
function reach(g, it, slack, extra) {
  const h = g.snake[0];
  return (abs(it.x - h.x) + abs(it.y - h.y)) / g.speed * slack + extra;
}

// a random free cell, preferably not right under the snake's nose
function spawn(g) {
  const { cols, rows, snake } = g, N = cols * rows, occ = new Uint8Array(N);
  for (const s of snake) occ[s.y * cols + s.x] = 1;
  if (g.food) occ[g.food.y * cols + g.food.x] = 1;
  if (g.bonus) occ[g.bonus.y * cols + g.bonus.x] = 1;
  let free = 0;
  for (let i = 0; i < N; i++) if (!occ[i]) free++;
  if (!free) return null;
  const h = snake[0];
  let pick = 0;
  for (let tries = 0; tries < 12; tries++) {
    let k = floor(Math.random() * free), i = 0;
    for (; i < N; i++) if (!occ[i] && k-- === 0) break;
    pick = i;
    if (abs((i % cols) - h.x) + abs(floor(i / cols) - h.y) >= 4) break;
  }
  return { x: pick % cols, y: floor(pick / cols), born: g.time };
}

function step(g) {
  if (g.demo && g.snake.length >= 56) { die(g, true); return false; }   // attract mode: bow out before crowding the title
  if (g.demo) { const d = aiChoose(g); if (d) g.dir = d; }
  else if (g.queue.length) g.dir = g.queue.shift();
  const h = g.snake[0], nx = h.x + g.dir.x, ny = h.y + g.dir.y, pop = g.grow === 0;
  let hit = nx < 0 || ny < 0 || nx >= g.cols || ny >= g.rows;
  // the tail cell is fair game when the tail is about to move out of it
  for (let i = 1, n = g.snake.length - (pop ? 1 : 0); i < n && !hit; i++) hit = g.snake[i].x === nx && g.snake[i].y === ny;
  if (hit) { die(g, false); return false; }
  g.snake.unshift({ x: nx, y: ny });
  if (pop) g.prevTail = g.snake.pop(); else { g.grow--; g.prevTail = null; }
  g.hunger++;

  if (g.food && nx === g.food.x && ny === g.food.y) g.pending = 'food';
  else if (g.bonus && nx === g.bonus.x && ny === g.bonus.y) g.pending = 'bonus';
  return true;
}

function resolveEat(g) {
  const bonus = g.pending === 'bonus'; g.pending = null;
  const it = bonus ? g.bonus : g.food;
  if (!it) return;
  const x = cellX(it.x), y = cellY(it.y), h = bonus ? 48 : hue + FOOD_SHIFT;
  g.hunger = 0; g.bulges.push({ s: 0, a: bonus ? 0.4 : 0.3 });
  burst(x, y, h, bonus ? 44 : 20, bonus ? 1.5 : 1, bonus ? 72 : 62);
  ring(x, y, h, cell * (bonus ? 3.6 : 2.1), bonus ? 0.7 : 0.5, bonus ? 4 : 2.6);
  ripple(x, y, bonus ? 1 : 0.6, bonus ? 16 : 13, bonus ? 1.2 : 0.8);
  if (bonus) g.bonus = null;
  else {
    g.grow++; g.eaten++; g.food = null; g.food = spawn(g);

      g.bonusIn = irnd(4, 7);
      const b = spawn(g);
      if (b) { b.ttl = b.life = clamp(reach(g, b, 2.2, 2.6), 4.5, 9); g.bonus = b; ring(cellX(b.x), cellY(b.y), 48, cell * 1.6, 0.6, 2); if (!g.demo) audio.bonusSpawn(); }
    }
  }
  tune(g); hueTarget = g.hue0 + g.eaten * 6;
  if (!g.demo) {
    g.combo = g.comboT > 0 ? min(g.combo + 1, 9) : 1; g.comboMax = max(g.comboMax, g.combo);
    g.comboT = g.comboWin = clamp(reach(g, g.food || it, 1.6, 1.2), 2.4, 8);   // time to make the next one count
    const pts = (bonus ? 50 : 10) * g.combo; g.score += pts;
    popup(x, y - cell * 0.5, '+' + pts, h, cell * (bonus ? 0.95 : 0.6 + min(g.combo, 6) * 0.045));
    shake = max(shake, bonus ? 8 : 2.2 + g.combo * 0.45); punch = max(punch, bonus ? 0.03 : 0.011);
    if (bonus) { glitch = max(glitch, 0.45); flash = 0.22; flashRGB = '255,230,170'; audio.bonus(); } else audio.eat(g.combo);
    audio.heat(g.combo); bump(scoreEl); if (g.combo > 1) bump(comboXEl);

}

function die(g, perfect) {
  g.alive = false; g.perfect = perfect; g.pending = null; g.dieT = 0; g.dieDur = 0; g.dissolve = 0;
  if (!perfect) {
    const h = g.snake[0], x = cellX(h.x) + g.dir.x * cell * 0.55, y = cellY(h.y) + g.dir.y * cell * 0.55;
    burst(x, y, 350, g.demo ? 14 : 34, 1.3, 70);
    ring(x, y, 350, cell * (g.demo ? 2.2 : 4.5), 0.7, 4);
    ripple(x, y, g.demo ? 0.6 : 1.1, 18, 1.4);
  }
  if (g.demo) return;
  setMode('dying'); audio.heat(0);
  if (perfect) return;
  shake = 20; glitch = 1; flash = 0.3; flashRGB = '255,50,90'; hurt = 1; freeze = 0.07; timeScale = 0.25;
  audio.die(); buzz(120);
}

function updateGame(g, gdt, dt) {
  if (!g.alive) { g.dieT += dt; return; }
  g.time += gdt;
  if (g.delay > 0) g.delay -= gdt;
  else {
    g.acc += gdt;
    for (let guard = 0; g.acc >= g.stepTime && guard < 5; guard++) {
      if (g.pending) resolveEat(g);
      if (!g.alive) return;
      g.acc -= g.stepTime;
      if (!step(g)) return;
    }
    if (g.acc > g.stepTime) g.acc = g.stepTime;
    if (g.pending && g.acc >= g.stepTime * 0.42) { resolveEat(g); if (!g.alive) return; }
  }
  g.angle = turnTo(g.angle, atan2(g.dir.y, g.dir.x), 1 - exp(-dt * 24), TAU);
  if (!g.demo && g.comboT > 0 && (g.comboT -= gdt) <= 0) {

// the dead snake burns away from head to tail
function dissolveFx(g) {
  if (!g.dieDur) { g.dieDur = clamp(0.4 + PLEN * 0.014, 0.55, 1.5); g.dieEnd = 0.16 + g.dieDur + (g.demo ? 0.7 : 0.5); }

  if (g.dissolve <= from) return;

    const s = PS[i];

    }

}

// ── autopilot for the attract mode ──────────────────────────────────────
const AI = { n: 0, free: null, dist: null, prev: null, q: null, mark: null };
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

// breadth-first distances from `start`. timed: a cell opens once `block[c]` moves have passed
function bfs(cols, rows, start, block, timed) {
  const { dist, prev, q } = AI;
  dist.fill(-1, 0, cols * rows);
  let qh = 0, qt = 0;
  q[qt++] = start; dist[start] = 0; prev[start] = -1;
  while (qh < qt) {
    const c = q[qh++], d = dist[c] + 1, x = c % cols, y = (c / cols) | 0;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX[k], ny = y + DY[k];
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const nc = ny * cols + nx;
      if (dist[nc] !== -1 || (timed ? block[nc] > d : block[nc] > 0)) continue;
      dist[nc] = d; prev[nc] = c; q[qt++] = nc;
    }
  }
}

function aiChoose(g) {
  const { cols, rows, snake } = g, N = cols * rows, n = snake.length;
  if (AI.n < N) { AI.n = N; AI.free = new Int32Array(N); AI.dist = new Int32Array(N); AI.prev = new Int32Array(N); AI.q = new Int32Array(N); AI.mark = new Uint8Array(N); }
  const { free, dist, prev, mark } = AI, at = (p) => p.y * cols + p.x;
  free.fill(0, 0, N);
  for (let i = 0; i < n; i++) free[at(snake[i])] = n - i + g.grow;   // moves until that segment has gone
  const head = at(snake[0]), target = g.bonus && g.bonus.life > 1.5 ? g.bonus : g.food;
  let move = -1;

  // shortest route to the food — taken only if the snake could still reach its own tail afterwards
  if (target) {
    bfs(cols, rows, head, free, true);
    const goal = at(target);
    if (dist[goal] > 0) {
      const path = [];
      for (let c = goal; c !== head; c = prev[c]) path.push(c);
      const first = path[path.length - 1];
      let ok = g.hunger > N * 1.5;
      if (!ok) {
        const total = n + g.grow + 1;
        let count = 0, tail = goal;
        mark.fill(0, 0, N);
        for (let i = 0; i < path.length && count < total; i++, count++) { mark[path[i]] = 1; tail = path[i]; }
        for (let i = 0; i < n && count < total; i++, count++) { tail = at(snake[i]); mark[tail] = 1; }
        mark[tail] = 0;
        bfs(cols, rows, goal, mark, false);
        ok = dist[tail] > 0;
      }
      if (ok) move = first;
    }
  }

  // otherwise stall: follow the tail the long way round, or failing that head for open space
  if (move < 0) {
    const keep = g.grow > 0 ? n : n - 1, tail = at(snake[keep - 1]);
    let bestScore = -1;
    for (let k = 0; k < 4; k++) {
      const nx = snake[0].x + DX[k], ny = snake[0].y + DY[k];
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const nc = ny * cols + nx;
      if (free[nc] > 1) continue;
      mark.fill(0, 0, N);
      for (let i = 0; i < keep; i++) mark[at(snake[i])] = 1;
      mark[tail] = 0;
      bfs(cols, rows, nc, mark, false);
      let score = 0;
      if (nc !== tail && dist[tail] > 0) score = 100000 + dist[tail];
      else for (let i = 0; i < N; i++) if (dist[i] >= 0) score++;
      if (score > bestScore) { bestScore = score; move = nc; }
    }
  }
  if (move < 0) return null;
  return { x: (move % cols) - snake[0].x, y: ((move / cols) | 0) - snake[0].y };
}

// ── snake geometry: a smooth centre line sampled by arc length ──────────
const cX = new Float32Array(1400), cY = new Float32Array(1400);
const fX = new Float32Array(9900), fY = new Float32Array(9900);
const PX = new Float32Array(9000), PY = new Float32Array(9000), PS = new Float32Array(9000);
const PR = new Float32Array(9000), PH = new Float32Array(9000), PL = new Float32Array(9000);   // radius, hue, lightness per sample
let PN = 0, PLEN = 0;

function buildPath(g) {
  const sn = g.snake, n = sn.length;
  const t = g.alive ? (g.delay > 0 ? 0 : clamp(g.acc / g.stepTime, 0, 1)) : 1;
  let m = 0;
  const put = (x, y) => { if (m && abs(cX[m - 1] - x) < 1e-4 && abs(cY[m - 1] - y) < 1e-4) return; cX[m] = x; cY[m] = y; m++; };
  // control points, in cells: sliding head, the body, sliding tail
  if (!g.alive && !g.perfect) { const b = 0.3 * outCubic(min(1, g.dieT / 0.07)); put(sn[0].x + g.dir.x * b, sn[0].y + g.dir.y * b); }
  put(sn[1].x + (sn[0].x - sn[1].x) * t, sn[1].y + (sn[0].y - sn[1].y) * t);
  for (let i = 1; i < n; i++) put(sn[i].x, sn[i].y);
  if (g.prevTail) { const l = sn[n - 1]; put(g.prevTail.x + (l.x - g.prevTail.x) * t, g.prevTail.y + (l.y - g.prevTail.y) * t); }

  // round every corner with a quadratic from midpoint to midpoint
  let f = 1;
  fX[0] = cX[0]; fY[0] = cY[0];
  for (let i = 1; i < m - 1; i++) {
    const x0 = cX[i - 1], y0 = cY[i - 1], x1 = cX[i], y1 = cY[i], x2 = cX[i + 1], y2 = cY[i + 1];
    if (abs((x1 - x0) * (y2 - y1) - (y1 - y0) * (x2 - x1)) < 1e-6) { fX[f] = x1; fY[f] = y1; f++; continue; }
    const ax = (x0 + x1) / 2, ay = (y0 + y1) / 2, ex = (x1 + x2) / 2, ey = (y1 + y2) / 2;
    for (let k = 0; k <= 6; k++) { const u = k / 6, v = 1 - u; fX[f] = v * v * ax + 2 * u * v * x1 + u * u * ex; fY[f] = v * v * ay + 2 * u * v * y1 + u * u * ey; f++; }
  }
  if (m > 1) { fX[f] = cX[m - 1]; fY[f] = cY[m - 1]; f++; }

  // resample at even spacing so colour, taper and bulges can be keyed to distance from the head
  const ds = n > 260 ? 0.34 : n > 120 ? 0.26 : 0.2;
  PX[0] = fX[0]; PY[0] = fY[0]; PS[0] = 0; PN = 1;
  let dist = 0, next = ds;
  for (let i = 1; i < f; i++) {
    const dx = fX[i] - fX[i - 1], dy = fY[i] - fY[i - 1], L = sqrt(dx * dx + dy * dy);
    if (L < 1e-6) continue;
    while (dist + L >= next) { const u = (next - dist) / L; PX[PN] = fX[i - 1] + dx * u; PY[PN] = fY[i - 1] + dy * u; PS[PN] = next; PN++; next += ds; }
    dist += L;
  }
  if (dist - PS[PN - 1] > 0.02) { PX[PN] = fX[f - 1]; PY[PN] = fY[f - 1]; PS[PN] = dist; PN++; }
  PLEN = dist;
}

function bodyHue(s) { return hue + SPREAD * (0.5 - 0.5 * cos(PI * s / 13)); }

// girth, hue and lightness for every sample, worked out once per frame
function shade(g) {
  const len = PLEN, taper = min(3.4, len * 0.5), heat = g.demo ? 0 : min(3, (g.combo - 1) * 0.5);
  const hit = g.alive ? 0 : max(0, 1 - g.dieT * 6);
  for (let i = 0; i < PN; i++) {
    const s = PS[i], d = len - s;
    let r = 0.37 * (1 + 0.23 * exp(-s * s / 0.55));                       // head
    if (d < taper) r *= 0.34 + 0.66 * smooth(0, taper, d);                 // tail
    for (let j = 0; j < g.bulges.length; j++) {                            // swallowed food travelling down
      const b = g.bulges[j], k = s - b.s;
      if (k > -2.6 && k < 2.6) r *= 1 + b.a * clamp((len - b.s) / 2, 0, 1) * exp(-k * k / 1.3);
    }
    const h = wrap360(bodyHue(s)), blue = max(0, 1 - abs(h - 245) / 50);  // blues read dark, lift them
    let l = 52 + 4 * sin(s * 0.85 - g.time * 7) + 7 * blue + heat;         // bands of light run down the body
    PR[i] = r; PH[i] = h; PL[i] = l + (86 - l) * hit;
  }
}

// ── drawing ─────────────────────────────────────────────────────────────
function camera(c, sx, sy) {
  const z = 1 + punch, ox = bx + bw / 2, oy = by + bh / 2;
  c.setTransform(sx * z, 0, 0, sy * z, sx * (ox * (1 - z) + shX), sy * (oy * (1 - z) + shY));
}

function drawDust(c, t) {
  c.fillStyle = hsla(hue + 30, 80, 82, 1);
  for (const d of dust) {
    const x = ((((d.x + t * 0.004 * d.z + sin(t * 0.21 + d.p) * 0.012) % 1) + 1) % 1) * W;
    const y = ((((d.y - t * 0.006 * d.z) % 1) + 1) % 1) * H;
    c.globalAlpha = (0.1 + 0.25 * d.z) * (0.6 + 0.4 * sin(t * (0.6 + d.z) + d.p));
    c.beginPath(); c.arc(x, y, 0.6 + d.z * 1.3, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
}

// grid dots light up around the head and the food, and ride every shockwave
function drawDots(c, g, gp) {
  const hx = bx + (PX[0] + 0.5) * cell, hy = by + (PY[0] + 0.5) * cell, live = g.alive;
  const sp2 = 2 * (cell * 2.3) ** 2, r0 = max(0.8, cell * 0.034);
  const f = g.food, fx = f ? cellX(f.x) : 0, fy = f ? cellY(f.y) : 0, fp = 0.22 + 0.1 * sin(g.time * 5);
  c.fillStyle = hsla(hue + 24, 95, 80, 1);
  for (let j = 0; j < g.rows; j++) for (let i = 0; i < g.cols; i++) {
    const x = bx + (i + 0.5) * cell, y = by + (j + 0.5) * cell;
    let I = 0, ox = 0, oy = 0;
    if (live) { const dx = x - hx, dy = y - hy; I += 0.5 * exp(-(dx * dx + dy * dy) / sp2); }
    if (f) { const dx = x - fx, dy = y - fy; I += fp * exp(-(dx * dx + dy * dy) / (sp2 * 0.3)); }
    for (let k = 0; k < ripples.length; k++) {
      const r = ripples[k], dx = x - r.x, dy = y - r.y, d = sqrt(dx * dx + dy * dy) + 0.01, q = (d - r.r) / r.w;
      if (q > -2.5 && q < 2.5) { const a = r.a * exp(-q * q); I += a; ox += dx / d * a * cell * 0.24; oy += dy / d * a * cell * 0.24; }
    }
    if (I < 0.035) continue;
    if (I > 1) I = 1;
    c.globalAlpha = gp ? I * 0.55 : I;
    c.beginPath(); c.arc(x + ox, y + oy, r0 + I * cell * 0.06, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
}

function light(c, x, y, r, h, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hsla(h, 100, 60, a)); g.addColorStop(0.5, hsla(h, 100, 55, a * 0.3)); g.addColorStop(1, hsla(h, 100, 50, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}

// soft pools of light on the board under the head, the food and the bonus
function drawLights(c, g) {
  c.save();
  rr(c, bx - cell * PAD, by - cell * PAD, bw + cell * PAD * 2, bh + cell * PAD * 2, cell * 0.5); c.clip();
  c.globalCompositeOperation = 'lighter';
  if (g.alive) light(c, bx + (PX[0] + 0.5) * cell, by + (PY[0] + 0.5) * cell, cell * 4.6, hue + 10, 0.2);
  if (g.food) light(c, cellX(g.food.x), cellY(g.food.y), cell * (2.7 + 0.25 * beat), hue + FOOD_SHIFT, 0.2);
  if (g.bonus) light(c, cellX(g.bonus.x), cellY(g.bonus.y), cell * 3.2, g.time * 160, 0.22);
  c.restore();
}

function drawFrame(c, gp) {
  const p = cell * PAD, h = turnTo(hue, 350, hurt, 360), a = min(1, 0.5 + 0.28 * beat + 0.4 * hurt);
  rr(c, bx - p, by - p, bw + p * 2, bh + p * 2, cell * 0.5);
  c.strokeStyle = hsla(h, 100, gp ? 58 : 74, gp ? a * 0.8 : a); c.lineWidth = gp ? 4 : 1.5; c.stroke();
}

function drawFood(c, g, gp) {
  const f = g.food;
  if (!f) return;
  const x = cellX(f.x), y = cellY(f.y), h = hue + FOOD_SHIFT;
  const r = cell * 0.3 * outBack(clamp((g.time - f.born) / 0.35, 0, 1)) * (1 + 0.07 * sin(g.time * 5.2) + 0.1 * beat);
  if (r <= 0.01) return;
  if (gp) { c.fillStyle = hsla(h, 100, 60, 1); c.beginPath(); c.arc(x, y, r * 1.15, 0, TAU); c.fill(); return; }
  const halo = c.createRadialGradient(x, y, 0, x, y, cell * 0.95);
  halo.addColorStop(0, hsla(h, 100, 60, 0.34)); halo.addColorStop(1, hsla(h, 100, 60, 0));
  c.fillStyle = halo; c.beginPath(); c.arc(x, y, cell * 0.95, 0, TAU); c.fill();
  const core = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.05, x, y, r);
  core.addColorStop(0, '#fff'); core.addColorStop(0.35, hsla(h, 100, 72, 1)); core.addColorStop(1, hsla(h - 14, 100, 50, 1));
  c.fillStyle = core; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  const a = g.time * 2.4;
  c.strokeStyle = hsla(h, 100, 76, 0.8); c.lineWidth = max(1, cell * 0.035); c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, r * 1.6, a, a + 1.5); c.stroke();
  c.beginPath(); c.arc(x, y, r * 1.6, a + PI, a + PI + 1.5); c.stroke();
}

function starPath(c, x, y, R, r, rot) {
  c.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * PI / 4, q = i % 2 ? r : R; c.lineTo(x + cos(a) * q, y + sin(a) * q); }
  c.closePath();
}

function drawBonus(c, g, gp) {
  const b = g.bonus;
  if (!b) return;
  const x = cellX(b.x), y = cellY(b.y), h = g.time * 160;
  const R = cell * 0.46 * outBack(clamp((b.ttl - b.life) / 0.4, 0, 1)) * (1 + 0.08 * sin(g.time * 7)), rot = g.time * 1.6;
  if (R <= 0.01) return;
  c.globalAlpha = b.life < 1.6 ? 0.4 + 0.6 * abs(sin(b.life * 13)) : 1;   // flicker before it expires
  if (gp) { c.fillStyle = hsla(h, 100, 64, 1); starPath(c, x, y, R, R * 0.42, rot); c.fill(); c.globalAlpha = 1; return; }
  const fill = c.createRadialGradient(x, y, 0, x, y, R);
  fill.addColorStop(0, '#fff'); fill.addColorStop(0.4, hsla(h, 100, 82, 1)); fill.addColorStop(1, hsla(h + 40, 100, 62, 1));
  c.fillStyle = fill; starPath(c, x, y, R, R * 0.38, rot); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.92)'; starPath(c, x, y, R * 0.52, R * 0.15, -rot * 1.4 + 0.6); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = max(1.2, cell * 0.05); c.lineCap = 'round';
  c.beginPath(); c.arc(x, y, cell * 0.58, -PI / 2, -PI / 2 + TAU * clamp(b.life / b.ttl, 0.001, 1)); c.stroke();
  c.globalAlpha = 1;
}

function tracePath(c, i0, i1, ox, oy) {
  c.beginPath(); c.moveTo(bx + (PX[i0] + 0.5) * cell + ox, by + (PY[i0] + 0.5) * cell + oy);
  for (let i = i0 + 1; i <= i1; i++) c.lineTo(bx + (PX[i] + 0.5) * cell + ox, by + (PY[i] + 0.5) * cell + oy);
}

// the tube is built from short capsules, tail to head, each with its own colour and girth
function capsules(c, i0, last, hop, k, lift) {
  for (let j = last; j > i0;) {
    const i = max(i0, j - hop);
    c.strokeStyle = hsla(PH[i], 100, clamp(PL[i] + lift, 0, 100), 1); c.lineWidth = 2 * PR[i] * cell * k;
    c.beginPath(); c.moveTo(bx + (PX[i] + 0.5) * cell, by + (PY[i] + 0.5) * cell); c.lineTo(bx + (PX[j] + 0.5) * cell, by + (PY[j] + 0.5) * cell); c.stroke();
    j = i;
  }
}

function drawSnake(c, g, gp) {
  if (PN < 2) return;
  const last = PN - 1;
  let i0 = 0;
  if (!g.alive) { while (i0 < last && PS[i0] < g.dissolve) i0++; if (i0 >= last) return; }
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (gp) { capsules(c, i0, last, 2, 0.92, 4); return; }
  c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = cell * 0.74;
  tracePath(c, i0, last, 0, cell * 0.14); c.stroke();
  if (g.alive) drawTongue(c, g);
  capsules(c, i0, last, 1, 1, -15);        // dark rim
  capsules(c, i0, last, 1, 0.78, 0);       // body
  capsules(c, i0, last, 1, 0.38, 8);       // lit core
  let i1 = last;                            // specular streak, stopping short of the tail taper
  while (i1 > i0 && PS[i1] > PLEN - 2.2) i1--;
  if (i1 > i0) { c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = max(1, cell * 0.055); tracePath(c, i0, i1, -cell * 0.09, -cell * 0.11); c.stroke(); }
  if (g.dissolve < 0.3) drawEyes(c, g);
}

function drawTongue(c, g) {
  if (g.tongue > 0) return;
  const k = sin(clamp(-g.tongue / 0.42, 0, 1) * PI), a = g.angle + sin(g.time * 40) * 0.14 * k;
  const hx = bx + (PX[0] + 0.5) * cell, hy = by + (PY[0] + 0.5) * cell;
  const x0 = hx + cos(g.angle) * cell * 0.3, y0 = hy + sin(g.angle) * cell * 0.3;
  const L = cell * (0.12 + 0.5 * k), x1 = x0 + cos(a) * L, y1 = y0 + sin(a) * L, fork = cell * 0.17 * k;
  c.strokeStyle = '#ff4f8b'; c.lineWidth = max(1, cell * 0.055);
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.lineTo(x1 + cos(a + 0.55) * fork, y1 + sin(a + 0.55) * fork);
  c.moveTo(x1, y1); c.lineTo(x1 + cos(a - 0.55) * fork, y1 + sin(a - 0.55) * fork); c.stroke();
}

function drawEyes(c, g) {
  const hx = bx + (PX[0] + 0.5) * cell, hy = by + (PY[0] + 0.5) * cell, a = g.angle, fx = cos(a), fy = sin(a), R = cell;
  const shock = g.alive ? 0 : 1, open = g.alive && g.blink < 0 ? 0.12 : 1, t = g.bonus || g.food;
  let tx = fx, ty = fy;
  if (t) { const dx = cellX(t.x) - hx, dy = cellY(t.y) - hy, d = hypot(dx, dy) || 1; tx = dx / d; ty = dy / d; }   // watch the food
  for (let s = -1; s <= 1; s += 2) {
    const ex = hx + fx * R * 0.1 - fy * R * 0.21 * s, ey = hy + fy * R * 0.1 + fx * R * 0.21 * s, er = R * (shock ? 0.17 : 0.145);
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, ey, er * open, er, a, 0, TAU); c.fill();
    if (open < 1) continue;
    const px = ex + tx * R * 0.05 * (1 - shock), py = ey + ty * R * 0.05 * (1 - shock);
    c.fillStyle = '#080a18'; c.beginPath(); c.arc(px, py, R * (shock ? 0.05 : 0.078), 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.95)'; c.beginPath(); c.arc(px - R * 0.026, py - R * 0.03, R * 0.024, 0, TAU); c.fill();
  }
}

function drawRings(c) {
  for (const r of rings) {
    const t = 1 - r.life / r.ttl;
    c.strokeStyle = hsla(r.h, 100, 68, (1 - t) ** 1.5); c.lineWidth = r.w * (1 - t) + 0.5;
    c.beginPath(); c.arc(r.x, r.y, cell * 0.2 + (r.r1 - cell * 0.2) * outCubic(t), 0, TAU); c.stroke();
  }
}

function drawParts(c) {
  c.lineCap = 'round';
  for (const p of parts) {
    const a = p.life / p.ttl;
    c.strokeStyle = hsla(p.h, 100, p.l, a); c.lineWidth = p.size * (0.4 + 0.6 * a);
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03 + 0.01, p.y - p.vy * 0.03); c.stroke();
  }
}

function drawPopups(c, gp) {
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const p of popups) {
    const t = 1 - p.life / p.ttl, a = t < 0.1 ? t / 0.1 : 1 - smooth(0.55, 1, t);
    c.font = `800 ${(p.size * (0.7 + 0.3 * outBack(min(1, t / 0.22)))).toFixed(1)}px ${FONT}`;
    c.fillStyle = hsla(p.h, 100, gp ? 60 : 88, gp ? a * 0.4 : a);
    c.fillText(p.text, p.x, p.y - cell * 1.1 * outCubic(t));
  }
}

function drawScene(c, g, gp) {
  drawFood(c, g, gp); drawBonus(c, g, gp); drawSnake(c, g, gp);
  c.globalCompositeOperation = 'lighter';
  drawRings(c); drawParts(c);
  c.globalCompositeOperation = 'source-over';
  drawPopups(c, gp);
}

// bloom: everything emissive is redrawn small and blurred down a mip chain; render() lays it
// under the crisp scene as a halo and adds a little back on top for heat
function bloom() {
  for (let i = 1; i < glow.length; i++) {
    const b = glow[i].x;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'copy';
    b.drawImage(glow[i - 1].c, 0, 0, glow[i].w, glow[i].h);
  }
  for (let i = glow.length - 2; i >= 0; i--) {
    const b = glow[i].x;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'lighter';
    b.drawImage(glow[i + 1].c, 0, 0, glow[i].w, glow[i].h);
  }
}

function addGlow(a) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (; a > 0.01; a -= 1) { ctx.globalAlpha = min(1, a); ctx.drawImage(glow[0].c, 0, 0, canvas.width, canvas.height); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// impact dressing: red/cyan ghosts, torn scanlines, a colour flash
function post() {
  const c = ctx, cw = canvas.width, ch = canvas.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (glitch > 0.02 && !calm) {
    if (!ghostR) { ghostR = mkCanvas(ceil(cw / 2), ceil(ch / 2)); ghostB = mkCanvas(ghostR.w, ghostR.h); }
    for (const [b, tint] of [[ghostR, '#ff003c'], [ghostB, '#00e5ff']]) {
      const x = b.x;
      x.globalCompositeOperation = 'copy'; x.fillStyle = '#000'; x.fillRect(0, 0, b.w, b.h);
      x.globalCompositeOperation = 'source-over'; x.drawImage(canvas, 0, 0, b.w, b.h);
      x.globalCompositeOperation = 'multiply'; x.fillStyle = tint; x.fillRect(0, 0, b.w, b.h);
      x.globalCompositeOperation = 'destination-in'; x.drawImage(canvas, 0, 0, b.w, b.h);
    }
    const d = glitch * 14 * dpr;
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = min(1, glitch * 1.3);
    c.drawImage(ghostR.c, -d, 0, cw, ch); c.drawImage(ghostB.c, d, 0, cw, ch);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    for (let i = (glitch * 5) | 0; i > 0; i--) {
      const y = (Math.random() * ch) | 0, h = max(2, (rnd(0.01, 0.06) * ch) | 0);
      c.drawImage(canvas, 0, y, cw, h, rnd(-1, 1) * glitch * 40 * dpr, y, cw, h);
    }
  }
  if (flash > 0.01) {
    c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(${flashRGB},${flash.toFixed(3)})`;
    c.fillRect(0, 0, cw, ch); c.globalCompositeOperation = 'source-over';
  }
}

function render() {
  const g = G, c = ctx, k = calm ? 0.25 : 1, t = realTime;
  shX = (sin(t * 71) + sin(t * 113 + 1.3)) * 0.5 * shake * k;
  shY = (sin(t * 89 + 2.1) + sin(t * 67 + 0.4)) * 0.5 * shake * k;

  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, W, H);
  drawDust(c, t);
  camera(c, dpr, dpr);
  c.drawImage(boardCv, bx - boardOff, by - boardOff, boardW, boardH);
  drawLights(c, g); drawDots(c, g, false); drawFrame(c, false);

  shade(g);
  const g0 = glow[0], gc = g0.x;
  gc.setTransform(1, 0, 0, 1, 0, 0); gc.globalAlpha = 1; gc.globalCompositeOperation = 'source-over';
  gc.clearRect(0, 0, g0.w, g0.h);
  camera(gc, g0.w / W, g0.h / H);
  drawDots(gc, g, true); drawFrame(gc, true); drawScene(gc, g, true);
  bloom();

  const heat = (P && mode === 'playing' ? (P.combo - 1) * 0.02 : 0) + beat * 0.03;
  addGlow(BLOOM + heat * 2);
  camera(c, dpr, dpr);
  drawScene(c, g, false);
  addGlow(HEAT + heat);
  post();
}

// ── hud & flow ──────────────────────────────────────────────────────────
function setText(el, v) { v = String(v); if (el._t !== v) { el._t = v; el.textContent = v; } }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

function setMode(m) { mode = m; document.body.dataset.mode = m; audio.scene(m); }
function setGame(g) { G = g; fitBoard(); buildPath(g); }

function updateHud(dt) {
  const g = P, target = g ? g.score : 0;
  if (shownScore !== target) { shownScore += (target - shownScore) * min(1, dt * 14); if (abs(target - shownScore) < 0.6) shownScore = target; }
  setText(scoreEl, round(shownScore)); setText(bestEl, max(best, target));
  const on = !!g && (mode === 'playing' || mode === 'paused') && g.comboT > 0;
  if (on !== comboOn) { comboOn = on; comboEl.classList.toggle('on', on); }
  if (on) { setText(comboXEl, '×' + g.combo); comboBarEl.style.transform = `scaleX(${clamp(g.comboT / g.comboWin, 0, 1).toFixed(3)})`; }
  if (mode === 'over' && g) setText(finalEl, round(g.score * outCubic(clamp((realTime - overAt) / 0.9, 0, 1))));
}

// the page chrome follows the hue of the run
function syncCss() {
  const h = round(hue);
  if (abs(h - cssHue) < 2) return;
  cssHue = h;
  const s = document.documentElement.style;
  s.setProperty('--h1', wrap360(h)); s.setProperty('--h2', wrap360(h + 80)); s.setProperty('--h3', wrap360(h + FOOD_SHIFT));
  letters.forEach((el, i) => { el.style.setProperty('--a', hsla(h + i * 24, 100, 68)); el.style.setProperty('--b', hsla(h + i * 24 + 52, 100, 57)); });
}

function showBest() { menuBestEl.textContent = best > 0 ? 'BEST ' + best : ''; }

function startGame(dx, dy) {
  if (mode !== 'menu' && mode !== 'over') return;
  if (mode === 'over' && realTime - overAt < 0.55) return;   // don't let the death-mash restart the run
  P = newGame(false); setGame(P);
  if (dy) P.queue.push({ x: 0, y: dy });
  shownScore = 0; hueTarget = P.hue0; popups.length = 0; timeScale = 1; hurt = 0;
  const h = P.snake[0];
  ripple(cellX(h.x), cellY(h.y), 0.9, 26, 1.3); ring(cellX(h.x), cellY(h.y), HUE0, cell * 5, 0.7, 3);
  flash = 0.1; flashRGB = '190,255,250';
  setMode('playing'); audio.heat(1); audio.start();
}

function gameOver() {
  const g = P, record = g.score > best;
  if (record) { best = g.score; store.set('best', best); }
  overTitleEl.textContent = g.perfect ? 'PERFECT RUN' : 'GAME OVER';
  setText(finalEl, 0); newBestEl.classList.toggle('on', record);
  $('stLen').textContent = g.snake.length; $('stCombo').textContent = '×' + g.comboMax; $('stBest').textContent = best;
  showBest();
  overAt = realTime; demoAt = realTime + 0.9;
  setMode('over');
  if (record) audio.best();
}

function pause() { if (mode === 'playing') { setMode('paused'); audio.blip(false); } }
function resume() { if (mode === 'paused') { setMode('playing'); audio.blip(true); } }

function steer(x, y) {
  if (mode === 'menu') { startGame(x, y); return; }
  if (mode !== 'playing') return;
  const q = P.queue, last = q.length ? q[q.length - 1] : P.dir;
  if (q.length >= 3 || (last.x === x && last.y === y) || (last.x === -x && last.y === -y)) return;
  q.push({ x, y }); audio.turn();
}

function tap() {
  if (mode === 'menu' || mode === 'over') startGame();
  else if (mode === 'paused') resume();
}

// ── input ───────────────────────────────────────────────────────────────
const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  audio.unlock();
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  const d = KEYS[e.code];
  if (d) { e.preventDefault(); if (!e.repeat) steer(d[0], d[1]); return; }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (mode === 'playing') pause(); else if (mode === 'paused') resume(); else startGame();
  } else if (e.code === 'KeyP' || e.code === 'Escape') { if (mode === 'playing') pause(); else resume(); }
  else if (e.code === 'KeyM') toggleSound();
});

let ptr = null;
addEventListener('pointerdown', (e) => {
  audio.unlock();
  if (e.target.closest && e.target.closest('button')) return;
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
});
addEventListener('pointermove', (e) => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, need = e.pointerType === 'mouse' ? 30 : 18;
  if (abs(dx) < need && abs(dy) < need) return;
  ptr.moved = true; ptr.x = e.clientX; ptr.y = e.clientY;   // re-anchor so swipes chain without lifting
  if (abs(dx) > abs(dy)) steer(dx > 0 ? 1 : -1, 0); else steer(0, dy > 0 ? 1 : -1);
});
addEventListener('pointerup', (e) => {
  audio.unlock();
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.moved) tap();
  ptr = null;
});
addEventListener('pointercancel', () => { ptr = null; });

function toggleSound() { audio.unlock(); document.body.classList.toggle('muted', audio.toggle()); }
for (const b of document.querySelectorAll('button')) b.addEventListener('mousedown', (e) => e.preventDefault());   // keep focus off buttons
$('btnPlay').addEventListener('click', () => { audio.unlock(); startGame(); });
$('btnAgain').addEventListener('click', () => { audio.unlock(); startGame(); });
$('btnSound').addEventListener('click', toggleSound);
$('btnPause').addEventListener('click', () => { audio.unlock(); if (mode === 'playing') pause(); else resume(); });

addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); audio.sleep(document.hidden); });
addEventListener('resize', () => {
  metrics();
  if (G.demo) { const [c, r] = gridFor(); if (c !== G.cols || r !== G.rows) { G = newGame(true); parts.length = rings.length = ripples.length = 0; } }
  layout(); buildPath(G);
});

// ── main loop ───────────────────────────────────────────────────────────
function tick(dt) {
  realTime += dt;
  beat = audio.pulse(realTime);
  if (mode !== 'paused') {
    let gdt = dt * timeScale;
    if (freeze > 0) { freeze -= dt; gdt = 0; } else timeScale = min(1, timeScale + dt * 1.1);
    shake *= exp(-dt * 7.5); punch *= exp(-dt * 11); flash *= exp(-dt * 7); hurt *= exp(-dt * 2.2);
    glitch = max(0, glitch - dt * 2.6);
    hue = turnTo(hue, hueTarget, 1 - exp(-dt * 2.5), 360);
    updateGame(G, gdt, dt);
    updateFx(gdt);
    if (!G.alive && !G.done && G.dieT > G.dieEnd) { G.done = true; if (G.demo) setGame(newGame(true)); else gameOver(); }
    if (mode === 'over' && !G.demo && realTime >= demoAt) setGame(newGame(true));
    buildPath(G);
    if (!G.alive) dissolveFx(G);
  }
  updateHud(dt); syncCss();
}

let lastTs = 0, cost = 0, slowFor = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!(dt > 0)) return;
  if (dt > 0.25) dt = 1 / 60;                 // came back from a hidden tab
  const t0 = performance.now();
  tick(min(dt, 0.05)); render();
  // if drawing itself is eating the frame budget, trade resolution for speed
  cost += (performance.now() - t0 - cost) * 0.05;
  slowFor = cost > 14 ? slowFor + dt : 0;
  if (slowFor > 2 && quality > 0.5) { quality -= 0.25; slowFor = 0; cost = 0; layout(); }
}

// ── boot ────────────────────────────────────────────────────────────────
(() => {   // film grain, generated once
  const n = 160, cv = mkCanvas(n, n), im = cv.x.createImageData(n, n), d = im.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = Math.random() * 255; d[i + 3] = Math.random() * 18; }
  cv.x.putImageData(im, 0, 0);
  $('grain').style.backgroundImage = `url(${cv.c.toDataURL()})`;
})();

document.body.classList.toggle('coarse', coarse);
document.body.classList.toggle('muted', audio.muted());
showBest();
metrics();
G = newGame(true);
layout(); buildPath(G); syncCss();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
